[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200
remappings = [
    "@reactive/=lib/reactive-lib-omni/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
lasna = "${LASNA_RPC}"
unichain_sepolia = "${UNICHAIN_SEPOLIA_RPC}"
base_sepolia = "${BASE_SEPOLIA_RPC}"

[lint]
lint_on_build = false
